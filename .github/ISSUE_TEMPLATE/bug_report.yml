name: Bug report
description: Report something that is not working as expected in Kanyx.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Kanyx! Please search existing issues before opening a new one.
        **Do not upload personal workspace databases, exports, attachments or sensitive information.**
  - type: input
    id: version
    attributes:
      label: Kanyx version
      description: Example — v1.0.0-rc.1
      placeholder: v1.0.0-rc.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: os-details
    attributes:
      label: OS / distribution details
      description: Include the Linux distribution and desktop environment, if relevant.
      placeholder: Windows 11 24H2 / Ubuntu 24.04 with GNOME
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the actions needed to trigger the bug.
      placeholder: |
        1. Open a board...
        2. Drag a card...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional details (optional)
      description: Sanitized screenshots, error messages, and relevant context. Do not include private workspace data.
